<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-Ga · Segunda Colección — Ref</title>
  <link rel="icon" type="image/svg+xml" href="shared/assets/favicon.svg" />
  <link rel="stylesheet" href="shared/styles.css?v=6" />
  <link rel="stylesheet" href="obras-exclusivas.css?v=9" />
  <style>
    body { background: #080808; }

    .ref-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 28px 48px;
    }
    .ref-header img { height: 36px; width: auto; }

    .ref-grid-wrap { padding: 0 48px 48px; }

    /* Fotos ya en B&W — sin filtro */
    .obra-img-base.bw { filter: none; }

    /* Fotos en color → B&W + contraste +30% */
    .obra-img-base.to-bw {
      filter: grayscale(100%) contrast(130%);
    }
  </style>
</head>
<body>

  <div class="ref-header">
    <img src="shared/assets/logo-simbolo-blanco.png" alt="Gamantri" />
    <div class="lang-toggle">
      <button class="lang-btn active">ES</button>
      <span class="lang-sep">·</span>
      <button class="lang-btn">EN</button>
    </div>
  </div>

  <div class="ref-grid-wrap">
    <div class="obras-grid oex-grid-bw">

      <!-- 1 — Penitentes nocturnos · BC Plomo — ya B&W -->
      <div class="obra-card">
        <div class="obra-celda"><div class="obra-img-wrap">
          <img class="obra-img-base bw" src="shared/assets/images/obras/E-Ga-2/(1).jpg" alt="" />
        </div></div>
      </div>

      <!-- 2 — Pared de granito · Cochamó — ya B&W -->
      <div class="obra-card">
        <div class="obra-celda"><div class="obra-img-wrap">
          <img class="obra-img-base bw" src="shared/assets/images/obras/E-Ga-2/(2).jpg" alt="" />
        </div></div>
      </div>

      <!-- 3 — Sol en estrella · Torrecillas — color → B&W -->
      <div class="obra-card">
        <div class="obra-celda"><div class="obra-img-wrap">
          <img class="obra-img-base to-bw" src="shared/assets/images/obras/E-Ga-2/(3).jpg" alt="" />
        </div></div>
      </div>

      <!-- 4 — Basalto hexagonal · La Cárcel — color → B&W -->
      <div class="obra-card">
        <div class="obra-celda"><div class="obra-img-wrap">
          <img class="obra-img-base to-bw" src="shared/assets/images/obras/E-Ga-2/(4).jpg" alt="" />
        </div></div>
      </div>

      <!-- 5 — Paisaje lunar andino · Renzo — color → B&W -->
      <div class="obra-card">
        <div class="obra-celda"><div class="obra-img-wrap">
          <img class="obra-img-base to-bw" src="shared/assets/images/obras/E-Ga-2/(5).jpg" alt="" />
        </div></div>
      </div>

      <!-- 6 — Arrieros · BC Plomo — ya B&W -->
      <div class="obra-card">
        <div class="obra-celda"><div class="obra-img-wrap">
          <img class="obra-img-base bw" src="shared/assets/images/obras/E-Ga-2/(6).jpg" alt="" />
        </div></div>
      </div>

      <!-- 7 — Interior La Cárcel — color → B&W -->
      <div class="obra-card">
        <div class="obra-celda"><div class="obra-img-wrap">
          <img class="obra-img-base to-bw" src="shared/assets/images/obras/E-Ga-2/(7).jpg" alt="" />
        </div></div>
      </div>

      <!-- 8 — Vía Láctea desierto · Geisers — color → B&W -->
      <div class="obra-card">
        <div class="obra-celda"><div class="obra-img-wrap">
          <img class="obra-img-base to-bw" src="shared/assets/images/obras/E-Ga-2/(8).jpg" alt="" />
        </div></div>
      </div>

      <!-- 9 — Rappel diagonal · Torrecillas — color → B&W -->
      <div class="obra-card">
        <div class="obra-celda"><div class="obra-img-wrap">
          <img class="obra-img-base to-bw" src="shared/assets/images/obras/E-Ga-2/(9).jpg" alt="" />
        </div></div>
      </div>

    </div>
  </div>

</body>
</html>
